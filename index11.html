<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
         <div class="container mt-3">
  <div class="row">
         <div class="col-12 bg-dark text-light p-4">
                <h1>Stunning Bootstrap Alignment Layout</h1>
            </div>
            <div class="container mt-4 bg-white">
         <div class="container mt-4">
        <div class="row align-items-center p-3 bg-light" style="height: 150px ;">
           <div class="col-12 col-lg-4 col-md-6 p-3 border bg-primary text-white text-center">Left box</div>
           <div class="col-12 col-lg-4 col-md-6 p-3 border bg-warning text-center">Middle box</div>
           <div class="col-12 col-lg-4 col-md-6 p-3 border bg-danger text-white text-center">Right box</div>
        </div>
           <div class="container mt-4">
        <div class="row justify-content-center p-3 bg-primary align-items-center" style="height: 150px ;">
           <div class="col-12 col-lg-4 col-md-6 p-3 bg-white text-center">Centered both ways</div>
           </div>
           <div class="container mt-4 ">
        <div class="row align-items-end p-3 bg-secondary" style="height: 150px;">
           <div class="col-12 col-lg-4 col-md-6 p-3 bg-dark text-white">Bottom align</div>
           <div class="col-12 col-lg-4 col-md-6 p-3 bg-success text-white">Also bottom aligned</div>
           <div class="col-12 col-lg-4 col-md-6 p-3 bg-dark text-white">Bottom align</div>
        </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
